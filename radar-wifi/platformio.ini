[platformio]
default_envs = heltec

; Firmware for the Heltec WiFi Kit 32 (ESP32-D0WDQ6, 8 MB flash).
[env:heltec]
; espressif32 6.1.0 = arduino-esp32 2.0.7 (ESP-IDF 4.4.4). Pinned while
; hunting a core whose wifi lib still accepts deauth frames via
; esp_wifi_80211_tx(WIFI_IF_AP): both this one and 2.0.17 (IDF 4.4.7) reject
; them all — err 0x102, "wifi:unsupport frame type: 0c0" (lab test vs
; alma_lab, 2026-10-18). Next attempt: AP-MAC cloning (see deauth_tx.cpp).
platform = espressif32@6.1.0
board = heltec_wifi_kit_32_V2
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
upload_port = /dev/cu.usbserial-0001
; Weak USB link on this machine: default 460800 fails at the stub stage.
upload_speed = 115200
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
lib_deps = olikraus/U8g2@^2.35.30
build_flags = -DCORE_DEBUG_LEVEL=0
build_src_flags = -Wall -Wextra
test_ignore = *

; Unit tests for lib/radar_core, run on the host: `pio test -e native`.
[env:native]
platform = native
; Same language level as the ESP32 toolchain, so tests catch what it rejects.
build_flags = -std=c++11 -Wall -Wextra
